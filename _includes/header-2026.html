                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"

                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

        <!-- Contains the actual navbar links. It collapses on smaller screens. -->
        <div
            class="collapse navbar-collapse justify-content-left"
            id="navbarNav"
        >
            <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="/#about">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/people">People</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/404.html">Projects</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/publications">Publications</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/press">Press</a>
            </li>
            <li class="nav-item">
                <!-- Includes a white call-to-action button with some additional classes -->
                {% include button.html alt=true classes="d-lg-none d-inline-block"%}
            </li>
            </ul>
        </div>
        {% include button.html alt=true classes="d-lg-inline-block d-none"%}
        </div>
    </nav>
</div>
